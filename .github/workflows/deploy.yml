# Deploy admin → Hostinger VPS (/opt/sweetcrust/admin)

name: Deploy Admin

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip --build (faster restart only)"
        type: boolean
        default: false

concurrency:
  group: hostinger-admin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Admin to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update -y && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "${HOSTINGER_SSH_KEY:-}" || { echo "Missing HOSTINGER_SSH_KEY"; exit 1; }
          test -n "${HOSTINGER_HOST:-}" || { echo "Missing HOSTINGER_HOST"; exit 1; }
          test -n "${HOSTINGER_USER:-}" || { echo "Missing HOSTINGER_USER"; exit 1; }
          PORT="${HOSTINGER_SSH_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keyscan -p "$PORT" -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host hostinger-vps
            HostName ${HOSTINGER_HOST}
            User ${HOSTINGER_USER}
            Port ${PORT}
            IdentityFile ~/.ssh/hostinger_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Smoke SSH
        run: ssh -o ConnectTimeout=15 -o BatchMode=yes hostinger-vps 'uname -a'

      - name: Write .env.production
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_SOCKET_BASE: ${{ vars.NUXT_PUBLIC_SOCKET_BASE }}
          NUXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NUXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          set -euo pipefail
          cat > .env.production <<EOF
          NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-https://admin.skbakery.in}
          NUXT_PUBLIC_SOCKET_BASE=${NUXT_PUBLIC_SOCKET_BASE:-https://admin.skbakery.in}
          NUXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NUXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
          ADMIN_DOMAIN=admin.skbakery.in
          CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
          DEPLOY_PATH=/opt/sweetcrust/admin
          EOF
          sed -i 's/^[[:space:]]*//' .env.production
          chmod 600 .env.production
          echo "API base: $(grep NUXT_PUBLIC_API_BASE .env.production)"
          echo "Maps key set: $(grep -q '^NUXT_PUBLIC_GOOGLE_MAPS_API_KEY=.\+' .env.production && echo yes || echo no)"

      - name: Deploy
        env:
          SKIP_BUILD: ${{ inputs.skip_build && '1' || '0' }}
        run: |
          set -euo pipefail
          chmod +x deploy/hostinger/*.sh
          # CI uses ~/.ssh/config Host hostinger-vps (no local hostinger_gha key)
          unset DEPLOY_SSH_KEY || true
          ./deploy/hostinger/deploy.sh --ci

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 "https://admin.skbakery.in/" || echo 000)
            if [[ "$code" =~ ^(200|301|302)$ ]]; then
              echo "OK https://admin.skbakery.in/ → $code"
              exit 0
            fi
            sleep 4
          done
          echo "Admin health failed" >&2
          exit 1
